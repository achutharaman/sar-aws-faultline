# Check-to-control mappings for S3 checks.
#
# Adding a framework means adding entries here plus a catalogue file under
# data/frameworks/. No Python changes.

[[mappings]]
check = "s3-bucket-public-access"

  [[mappings.controls]]
  framework = "cis-aws"
  control = "2.1.4"
  relationship = "supports"
  rationale = """
  The recommendation calls for Block Public Access to be configured on S3
  buckets. This check evaluates the effective public-access outcome of
  account-level and bucket-level Block Public Access settings together with
  bucket ACLs and bucket policy status.
  """

  [[mappings.controls]]
  framework = "soc2-tsc"
  control = "CC6.1"
  relationship = "partially_supports"
  derived_from = "cis-aws:2.1.4"
  rationale = """
  A bucket readable by anonymous principals is an absence of logical access
  control over a data store. Partial only: CC6.1 spans identity management,
  authorisation and periodic access review across the whole system, of which
  S3 public exposure is one narrow input.
  """

  [[mappings.controls]]
  framework = "soc2-tsc"
  control = "CC6.6"
  relationship = "partially_supports"
  derived_from = "cis-aws:2.1.4"
  rationale = """
  Public bucket access is by definition access originating outside the system
  boundary. Partial only: CC6.6 also covers network boundary protection, remote
  access and threat detection, none of which this check evaluates.
  """

[[mappings]]
check = "s3-block-public-access-disabled"

  [[mappings.controls]]
  framework = "cis-aws"
  control = "2.1.4"
  relationship = "supports"
  rationale = """
  The recommendation calls for Block Public Access to be configured on S3
  buckets. This check flags buckets where that configuration is incomplete,
  independently of whether the bucket happens to be publicly reachable right
  now.
  """

  [[mappings.controls]]
  framework = "soc2-tsc"
  control = "CC6.1"
  relationship = "partially_supports"
  derived_from = "cis-aws:2.1.4"
  rationale = """
  A bucket with no guardrail against a future public grant is a gap in
  preventive logical access control, even before any access has actually
  occurred. Partial only: CC6.1 spans identity management, authorisation and
  periodic access review across the whole system, of which this preventive
  S3 control is one narrow input.
  """

[[mappings]]
check = "s3-bucket-tls-not-enforced"

  [[mappings.controls]]
  framework = "cis-aws"
  control = "2.1.1"
  relationship = "supports"
  rationale = """
  The recommendation calls for S3 buckets to require SSL for all requests.
  This check evaluates the bucket policy for a Deny statement conditioned
  on aws:SecureTransport being false, the standard AWS-documented pattern
  the recommendation's own audit procedure checks for.
  """

  [[mappings.controls]]
  framework = "soc2-tsc"
  control = "CC6.7"
  relationship = "partially_supports"
  derived_from = "cis-aws:2.1.1"
  rationale = """
  Requiring TLS is the transmission half of the encryption mechanism CC6.7
  names, complementing the at-rest encryption checks in this project.
  Partial only: CC6.7 also covers encryption at rest and physical media
  removal, neither of which this check evaluates.
  """
