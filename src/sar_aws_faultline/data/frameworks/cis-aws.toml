# CIS Amazon Web Services Foundations Benchmark
#
# Mapping a check to a CIS recommendation is OBJECTIVE: recommendations are
# numbered, prescriptive and testable, so `interpretive = false`.
#
# Only recommendation identifiers and short paraphrased titles are stored here.
# The benchmark text is licensed by CIS and is not reproduced.
#
# NOTE: v5.0.0 exists and is what AWS Security Hub tracks. We target v4.0.0
# because its numbering is what these mappings were reviewed against. Advancing
# the version means re-reviewing every mapping, not editing this line.
id = "cis-aws"
name = "CIS Amazon Web Services Foundations Benchmark"
version = "4.0.0"
authority = "Center for Internet Security"
url = "https://www.cisecurity.org/benchmark/amazon_web_services"
interpretive = false
notice = """
CIS Benchmarks are published by the Center for Internet Security under its own
terms of use. This project references recommendation identifiers and paraphrased
titles only, and is neither affiliated with nor endorsed by CIS.
"""

[[controls]]
id = "2.1.4"
title = "S3 buckets should be configured with Block Public Access"

# 3.1 (CloudTrail multi-region trail) and 2.2.1 (EBS default encryption) and
# 3.6 (KMS key rotation) are stable across both the v3.0.0 and v5.0.0
# numbering that AWS Security Hub documents -- v4.0.0 sits between them and
# is not separately published, so agreement on both sides is the strongest
# evidence available short of the primary CIS document.
[[controls]]
id = "3.1"
title = "CloudTrail should be enabled in all regions with a multi-region trail"

[[controls]]
id = "2.2.1"
title = "EBS volume encryption should be enabled"

[[controls]]
id = "3.6"
title = "KMS key rotation should be enabled for customer managed keys"

# 1.5 (root account MFA) and 2.3.1 (RDS encryption) disagree between v3.0.0
# and v5.0.0 (root MFA: 1.5 vs 1.4; RDS: 2.3.1 vs 2.2.1) -- the renumbering
# landed somewhere in between and it isn't known which side of v4.0.0 it
# fell on. These use the v1.4.0/v3.0.0-consistent numbers as the better
# inference (two agreeing versions vs one), not a confirmed v4.0.0 citation.
# Revisit against the primary CIS v4.0.0 document if that becomes available.
[[controls]]
id = "1.5"
title = "MFA should be enabled for the root user account"

[[controls]]
id = "2.3.1"
title = "RDS DB instances should have encryption at rest enabled"

# 1.10 (MFA for console users), 1.14 (access key rotation), 1.8 (password
# minimum length) and 1.9 (password reuse prevention) are stable across
# v1.4.0 and v3.0.0 -- the same "two agreeing versions bracket v4.0.0"
# evidence used above, on the earlier side of the gap this time.
[[controls]]
id = "1.10"
title = "MFA should be enabled for all IAM users with a console password"

[[controls]]
id = "1.14"
title = "IAM user access keys should be rotated every 90 days or less"

[[controls]]
id = "1.8"
title = "IAM password policy should require a minimum length of 14 or more"

[[controls]]
id = "1.9"
title = "IAM password policy should prevent password reuse"

# 3.3 (AWS Config enabled), 3.7 (VPC flow logging) and 2.1.1 (S3 SSL
# required) are stable across v3.0.0 and v5.0.0, same high-confidence
# pattern as 3.1/2.2.1/3.6 above.
[[controls]]
id = "3.3"
title = "AWS Config should be enabled with an active recorder"

[[controls]]
id = "3.7"
title = "VPC flow logging should be enabled in all VPCs"

[[controls]]
id = "2.1.1"
title = "S3 buckets should require requests to use SSL"

# 5.2 (security groups open to the internet on admin ports) and 2.3.3 (RDS
# publicly accessible) exist only from v3.0.0 onward -- not supported at
# v1.4.0 under this numbering -- and disagree between v3.0.0 (5.2 / 2.3.3)
# and v5.0.0 (5.3 / 2.2.3). Same treatment as 1.5/2.3.1 above: the earlier,
# closer-to-v4.0.0 anchor is used as the better inference, not a confirmed
# citation.
[[controls]]
id = "5.2"
title = "Security groups should not allow unrestricted access to admin ports"

[[controls]]
id = "2.3.3"
title = "RDS DB instances should prohibit public access"

# RDS.5 (Multi-AZ) is documented by AWS Security Hub only from v5.0.0 --
# "not supported" at both v3.0.0 and v1.4.0 in that table, which is weaker
# evidence than every other citation in this file (no bracketing agreement
# at all, just one data point). Included anyway because it is still the
# closest real citation available; backup-retention, the alternative this
# check could have covered instead, has no CIS AWS Foundations citation in
# any version and was dropped rather than force one. Revisit this control's
# applicability to v4.0.0 specifically if the primary document becomes
# available.
[[controls]]
id = "2.2.4"
title = "RDS DB instances should be configured for multiple Availability Zones"
